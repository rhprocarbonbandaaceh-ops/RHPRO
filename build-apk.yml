name: Build RH PRO RACING TIMER APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RH_PRO_RACING_TIMER_v2_icon_speedometer.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: unzip -q RH_PRO_RACING_TIMER_v2_icon_speedometer.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/RH_PRO_RACING_TIMER
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RH-PRO-RACING-TIMER-APK
          path: extracted/RH_PRO_RACING_TIMER/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
